# CI：推送/PR 时 lint + 单元测试 + 类型检查 + 构建
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 产物资源必须是相对路径（可部署到 Transmission 的子目录）
      - name: Verify relative asset paths
        run: grep -o 'src="\./assets/[^"]*"' dist/index.html | head -1 | grep -q assets
