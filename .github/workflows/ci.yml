# CI：推送/PR 时 lint + 单元测试 + 类型检查 + 构建
name: CI
on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只需读取代码（对齐 release.yml 的显式 permissions 风格）
permissions:
  contents: read

# 同引用并发推送/PR 去重：新提交入队时取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 产物资源必须是相对路径（可部署到 Transmission 的子目录）
      - name: Verify relative asset paths
        run: grep -o 'src="\./assets/[^"]*"' dist/index.html | head -1 | grep -q assets
